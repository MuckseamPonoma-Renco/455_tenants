name: Cloud recovery

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Recovery work to run after configuration is ready
        required: true
        default: full
        type: choice
        options:
          - check
          - exports
          - status
          - watchdog
          - full
      force:
        description: Run now and retry blocked exports immediately
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - .github/workflows/cloud-recovery.yml
      - scripts/run_cloud_recovery_cycle.py
      - scripts/sync_cloud_chat_export_inbox.py
      - scripts/sync_chat_export_inbox.py
      - scripts/run_automation_daemon.py
      - packages/**
      - requirements.txt
  schedule:
    - cron: '3 * * * *'
    - cron: '11 * * * *'
    - cron: '27 */6 * * *'

permissions:
  contents: read

concurrency:
  group: tenant-issue-os-cloud-recovery
  # A deployment supersedes old code, while scheduled recovery modes serialize
  # so an export import is never cancelled midway by a delayed status run.
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUD_RECOVERY_ENABLED: ${{ secrets.CLOUD_RECOVERY_ENABLED }}
      CLOUD_RECOVERY_ENV: ${{ secrets.CLOUD_RECOVERY_ENV }}
      CLOUD_RECOVERY_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.CLOUD_RECOVERY_GOOGLE_SERVICE_ACCOUNT_JSON }}
      CLOUD_RECOVERY_SEMANTIC_OVERRIDES_GZIP_BASE64: ${{ secrets.CLOUD_RECOVERY_SEMANTIC_OVERRIDES_GZIP_BASE64 }}
      EVENT_SCHEDULE: ${{ github.event.schedule }}
      MANUAL_MODE: ${{ inputs.mode }}
      MANUAL_FORCE: ${{ inputs.force }}
      CLOUD_EXPORT_RETRY_STATE_PATH: ${{ github.workspace }}/.cloud-export-retries.json
    steps:
      - name: Choose a safe recovery mode
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          enabled="$(printf '%s' "${CLOUD_RECOVERY_ENABLED:-}" | tr '[:upper:]' '[:lower:]')"
          if [[ "$enabled" != "true" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Cloud recovery is not enabled."
            exit 0
          fi
          mode="full"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            mode="check"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            mode="${MANUAL_MODE:-full}"
          else
            case "$EVENT_SCHEDULE" in
              '3 * * * *') mode="exports" ;;
              '11 * * * *') mode="status" ;;
              '27 */6 * * *') mode="watchdog" ;;
            esac
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.mode.outputs.enabled == 'true'
        with:
          # Scheduled events may wait in GitHub's queue. Recovery must always
          # execute the current canonical renderer, not the event's older SHA.
          ref: main

      - uses: actions/setup-python@v7
        if: steps.mode.outputs.enabled == 'true'
        with:
          python-version: '3.12'
          cache: pip

      - name: Install recovery dependencies
        if: steps.mode.outputs.enabled == 'true'
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Restore automatic export retry schedule
        # Restore only hashed identities and retry counters/times, never the
        # private receipt/acknowledgement file, archive contents, or credentials.
        if: steps.mode.outputs.enabled == 'true' && (steps.mode.outputs.mode == 'exports' || steps.mode.outputs.mode == 'full')
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CLOUD_EXPORT_RETRY_STATE_PATH }}
          key: cloud-export-retries-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: cloud-export-retries-v1-

      - name: Run configuration check or recovery cycle
        if: steps.mode.outputs.enabled == 'true'
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          env_file="$RUNNER_TEMP/tenant-issue-os-cloud.env"
          credentials_file="$RUNNER_TEMP/tenant-issue-os-google-service-account.json"
          overrides_file="$RUNNER_TEMP/tenant-issue-os-semantic-overrides.json"
          trap 'rm -f "$env_file" "$credentials_file" "$overrides_file"' EXIT
          printf '%s\n' "$CLOUD_RECOVERY_ENV" > "$env_file"
          printf '%s\n' "$CLOUD_RECOVERY_GOOGLE_SERVICE_ACCOUNT_JSON" > "$credentials_file"
          python scripts/materialize_private_overrides.py --output "$overrides_file"
          export TENANT_PUBLIC_SEMANTIC_OVERRIDES_PATH="$overrides_file"
          export GOOGLE_APPLICATION_CREDENTIALS="$credentials_file"
          python scripts/run_cloud_recovery_cycle.py --env-file "$env_file" --check-config
          if [[ "$MODE" != "check" ]]; then
            git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
            if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
              echo "Refusing cloud recovery because main advanced after checkout." >&2
              exit 3
            fi
            extra_args=()
            if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$MANUAL_FORCE" == "true" ]]; then
              extra_args+=(--force)
            fi
            python scripts/run_cloud_recovery_cycle.py --env-file "$env_file" --mode "$MODE" "${extra_args[@]}"
          fi

      - name: Save automatic export retry schedule
        if: always() && steps.mode.outputs.enabled == 'true' && (steps.mode.outputs.mode == 'exports' || steps.mode.outputs.mode == 'full')
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CLOUD_EXPORT_RETRY_STATE_PATH }}
          key: cloud-export-retries-v1-${{ github.run_id }}-${{ github.run_attempt }}
